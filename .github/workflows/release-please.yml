name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      pr_number: ${{ steps.rp.outputs.pr }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # Trust boundary: steps.rp.outputs.pr is GitHub's JSON for the generated release PR
      # *including its body*, and that body repeats the merged commit subjects verbatim. The
      # payload therefore reaches the shell as DATA (the RP_PR env entry below, read back with jq)
      # and never as script text. A step that builds a command out of it lets any apostrophe in a
      # merged subject (`don't`, `Operator's`) close the quoted shell literal, after which the rest
      # of the payload is parsed as shell code: the step dies (`syntax error near unexpected token
      # `('`, or the leaked words reach jq as file names), the release PR is never merged and no
      # tag or asset appears - while `ci` on the same merge commit is green, so nothing tells the
      # author. For the same reason no expression is interpolated into any `run:` block in this
      # workflow; the runner's own environment ($GITHUB_REPOSITORY, $GITHUB_REF_NAME) is used
      # instead. Pinned by core/.../release/ReleasePleasePayloadTest.
      # The release branch is validated here rather than through the check the pull request page
      # shows for it: GitHub creates an approval-gated run of pullrequest.yml for any
      # GITHUB_TOKEN-created pull request, which never gets approved and therefore resolves to
      # `failure` with 0 jobs on every release PR. That run is the accepted red check documented
      # above the `on:` block of pullrequest.yml; the check runs this step audits are the native
      # `build (17)` / `build (21)` ones of the run dispatched below. Nothing is mirrored into
      # branch protection for a release PR (ReleasePleaseCheckAuditTest / the contract test
      # ReleaseBranchCheckContractTest).
      - name: Validate and merge release PR
        if: ${{ steps.rp.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RP_PR: ${{ steps.rp.outputs.pr }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(printf '%s' "$RP_PR" | jq -r '.number')
          PR_JSON=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefName,headRefOid)
          HEAD_REF=$(jq -r '.headRefName' <<< "$PR_JSON")
          HEAD_SHA=$(jq -r '.headRefOid' <<< "$PR_JSON")

          echo "Dispatching PR build for release PR #$PR_NUMBER at $HEAD_REF ($HEAD_SHA)"
          gh workflow run pullrequest.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$HEAD_REF"

          RUN_ID=""
          for _ in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow pullrequest.yml \
              --branch "$HEAD_REF" \
              --event workflow_dispatch \
              --json databaseId,headSha \
              --jq "map(select(.headSha == \"$HEAD_SHA\")) | .[0].databaseId // \"\"")
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::Timed out waiting for dispatched PR build to appear"
            exit 1
          fi

          echo "Waiting for PR build run $RUN_ID"
          STATUS=""
          CONCLUSION=""
          RUN_URL=""
          for _ in $(seq 1 180); do
            RUN_JSON=$(gh run view "$RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --json status,conclusion,url)
            STATUS=$(jq -r '.status' <<< "$RUN_JSON")
            CONCLUSION=$(jq -r '.conclusion // ""' <<< "$RUN_JSON")
            RUN_URL=$(jq -r '.url' <<< "$RUN_JSON")
            if [ "$STATUS" = "completed" ]; then
              break
            fi
            sleep 10
          done

          if [ "$STATUS" != "completed" ]; then
            echo "::error::Timed out waiting for PR build run $RUN_ID"
            exit 1
          fi

          CHECKS_JSON=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100")
          RUN_CHECKS=$(jq --arg run_url "$RUN_URL" '
            [
              .check_runs[]
              | select((.details_url // "") | startswith($run_url + "/job/"))
            ]
          ' <<< "$CHECKS_JSON")
          CHECK_COUNT=$(jq 'length' <<< "$RUN_CHECKS")
          if [ "$CHECK_COUNT" -eq 0 ]; then
            echo "::error::No native checks from run $RUN_ID found on commit $HEAD_SHA"
            exit 1
          fi

          echo "Native checks for run $RUN_ID on commit $HEAD_SHA:"
          jq -r '.[] | "\(.name): \(.status) / \(.conclusion // "none")"' \
            <<< "$RUN_CHECKS"
          BAD_CHECKS=$(jq '
            [
              .[]
              | select(.status != "completed" or .conclusion != "success")
            ]
          ' <<< "$RUN_CHECKS")
          if [ "$(jq 'length' <<< "$BAD_CHECKS")" -ne 0 ]; then
            echo "::error::Dispatched run has incomplete or unsuccessful native checks"
            jq -c '.[] | {name, status, conclusion, details_url}' <<< "$BAD_CHECKS"
            exit 1
          fi

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Release PR build concluded $CONCLUSION"
            exit 1
          fi

          CURRENT_HEAD_SHA=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefOid \
            --jq '.headRefOid')
          if [ "$CURRENT_HEAD_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Release PR moved from $HEAD_SHA to $CURRENT_HEAD_SHA during validation"
            exit 1
          fi

          # The merge stays synchronous (--merge, never --auto): release-please must re-read main
          # only after GitHub actually merged the release PR, and the rerun dispatch below depends
          # on that order.
          echo "Merging release PR #$PR_NUMBER"
          for _ in $(seq 1 30); do
            if gh pr merge "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --match-head-commit "$HEAD_SHA" \
              --merge; then
              break
            fi
            PR_STATE_JSON=$(gh pr view "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json state,headRefOid)
            STATE=$(jq -r '.state' <<< "$PR_STATE_JSON")
            if [ "$STATE" = "MERGED" ]; then
              CURRENT_HEAD_SHA=$(jq -r '.headRefOid' <<< "$PR_STATE_JSON")
              if [ "$CURRENT_HEAD_SHA" != "$HEAD_SHA" ]; then
                echo "::error::Release PR #$PR_NUMBER merged at unvalidated head $CURRENT_HEAD_SHA"
                exit 1
              fi
              break
            fi
            sleep 10
          done

          PR_STATE_JSON=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json state,headRefOid)
          STATE=$(jq -r '.state' <<< "$PR_STATE_JSON")
          CURRENT_HEAD_SHA=$(jq -r '.headRefOid' <<< "$PR_STATE_JSON")
          if [ "$STATE" != "MERGED" ] || [ "$CURRENT_HEAD_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Release PR #$PR_NUMBER did not merge"
            exit 1
          fi

          gh workflow run release-please.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME"

  trigger-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release.yml on the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG" \
            -f release_tag="$RELEASE_TAG"
