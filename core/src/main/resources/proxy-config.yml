# The endpoint name of this server/proxy instance registered on startup with the Connect network.
# Default is a random string. You can change it to a custom endpoint name.
endpoint: ${endpoint}

# This setting is only relevant if you want to allow cracked players to join.
# If left blank, the correct mode will be securely detected automatically.
allow-offline-mode-players: false

# The default locale for Connect. By default, Connect uses the system locale
#default-locale: en_US

# Optional parent endpoint names sent to WatchService as Connect-Endpoint-Parents.
# This plugin does not expose a public endpoint-control API.
#
# You can add as many super endpoint names as you want.
#super-endpoints:
#  - pvp-endpoint
#  - someones-hub

# Connect authenticates tunneled players at its edge and tells the proxy to skip its own
# online-mode handshake for them. Login/auth plugins (LibreLogin, AuthMe, nLogin, ...) that
# force online mode for every connection later in the same login event revert that decision,
# and the player then hangs forever on "Logging in..." because there is no second Mojang
# session to answer the proxy's encryption request.
#
# With this enabled, Connect re-asserts its own decision after every other plugin has run.
# It only ever acts on connections Connect itself authenticated, it never overrides another
# plugin's kick, and it does nothing when nobody changed the decision.
login-reassert:
  # Turn this off if you deliberately want another plugin to be able to change Connect's own
  # login decision. Off restores the previous behaviour: last writer wins, no floor.
  enabled: true

  # Also restore Connect's full game profile - the player's Mojang UUID and username - and
  # not just the skin properties.
  #
  # PREREQUISITE, read before enabling: only turn this on if every login plugin on this proxy
  # keys its own database on the player's Mojang UUID. For LibreLogin that means setting
  # `new-uuid-creator: MOJANG` in LibreLogin's config first. With its default `CRACKED` it
  # stores players under an offline UUID derived from the name, so restoring the Mojang UUID
  # makes its own lookups miss and its join handlers throw on every login.
  #
  # Leave this off unless you need ConnectApi.isConnectPlayer(uuid) / getPlayer(uuid) to
  # resolve for players who go through such a login plugin. The default (skin properties
  # only) fixes the login hang and the missing skin while keeping those plugins consistent.
  #
  # On BungeeCord there is no profile-properties API at pre-login, so `enabled` re-asserts
  # offline mode only and this option is what additionally re-asserts the UUID and username.
  restore-full-profile: false

# Connect Edge signs Bedrock/Xbox identity envelopes. This plugin trusts them by default
# because it fetches Minekube's verifier key over HTTPS from the authoritative metadata URL.
# The verifier rejects metadata URLs with userinfo/fragments and never follows redirects.
# Warn mode verifies and logs but never rejects; Java-only servers have no Bedrock sessions
# to verify, so this default does not weaken or change their admission behavior.
bedrock-identity:
  # disabled: do not verify or reject
  # warn: verify when any key source is configured and log failures, but allow the session
  # require: reject Bedrock sessions with missing or invalid identity envelopes
  # Values are exact; malformed identity settings never advertise trusted identity.
  enforcement: warn
  # To pin your own Ed25519 key, clear metadata-url and set public-key/public-keys.
  # Static keys are used only when metadata-url is empty.
  # Supports raw 32-byte and X.509 encoded keys after decoding.
  public-key: ""
  # Additional Base64-encoded Ed25519 keys used only when metadata-url is empty.
  public-keys: []
  # Authoritative exact HTTPS metadata URL for Moxy verifier keys.
  # Userinfo, fragments, and redirects are rejected; static keys are not a fallback.
  metadata-url: "https://watch-connect.minekube.net/.well-known/minekube-connect/bedrock-identity-keys.json"
  # Maximum seconds to cache successful metadata; a smaller published max-age takes precedence.
  metadata-cache-seconds: 300
  # Hard stale-if-error bound for expired remote keys. Require mode fails closed after this.
  metadata-max-stale-seconds: 600
  # Required non-blank issuer expected in Moxy metadata and signed envelopes.
  expected-issuer: minekube-connect
  # Required exact policy: linked_java_only or trusted_bedrock_xuid.
  expected-policy: trusted_bedrock_xuid

# bStats is a stat tracker that is entirely anonymous and tracks only basic information
# about Connect, such as how many people are online, how many servers are using Connect,
# what OS is being used, etc. You can learn more about bStats here: https://bstats.org/.
metrics:
  # If metrics should be disabled.
  disabled: false
  # The unique id that should be consistent for a server/proxy.
  uuid: ${metrics.uuid}

# Do not change this
config-version: 1
